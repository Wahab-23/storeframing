services:
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: storeframing_meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: storeframing_master_key
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  meilisearch_data:
